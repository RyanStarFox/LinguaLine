name: TranslationExercise
options:
  bundleIdPrefix: app.translationexercise
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  TranslationCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TranslationExercise/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.translationexercise.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
  TranslationExercise:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TranslationExercise
        excludes:
          - Services/**
          - Info.plist
    dependencies:
      - target: TranslationCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.translationexercise.daily
        PRODUCT_NAME: LinguaLine
        PRODUCT_MODULE_NAME: TranslationExercise
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LinguaLine
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 用于连接你在设置里填写的本机大模型服务。
        SWIFT_OBJC_BRIDGING_HEADER: TranslationExercise/Support/TranslationExercise-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-lz"]
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: TranslationExercise/TranslationExercise.entitlements
    info:
      path: TranslationExercise/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSHasLocalizedDisplayName: true
        MDItemKeywords:
          - 译笺
          - 譯箋
          - 訳箋
          - LinguaLine
        kMDItemKeywords:
          - 译笺
          - 譯箋
          - 訳箋
          - LinguaLine
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUbiquitousContainers:
          iCloud.app.translationexercise.daily:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: 译笺
            NSUbiquitousContainerSupportedFolderLevels: Any
    preBuildScripts:
      - name: Sync logo into asset catalog
        script: cp "${SRCROOT}/TranslationExercise/Resources/Logo.svg" "${SRCROOT}/TranslationExercise/Resources/Assets.xcassets/Logo.imageset/Logo.svg"
    scheme:
      testTargets:
        - TranslationExerciseTests
  TranslationExerciseTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TranslationExerciseTests
    dependencies:
      - target: TranslationCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.translationexercise.tests
